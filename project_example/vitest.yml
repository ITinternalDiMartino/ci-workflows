name: Run Frontend Tests

on:
  pull_request:
    branches-ignore: ["main", "dev"]
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "package.json"
      - "package-lock.json"
      - "vitest.config.ts"
      - ".github/workflows/vitest.yml"

permissions:
  contents: read

jobs:
  vitest:
    uses: ITinternalDiMartino/ci-workflows/.github/workflows/vitest.yml@main
    with:
      # la versione del PHP del dominio: va allineata al server
      php-version: "8.4"
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
