name: Deploy

# Chiamata alla pipeline di deploy condivisa.
#
# Prima del primo deploy, dal repository ci-workflows (vedi scripts/README.md):
#   - scripts/setup-releases.sh prepara il layout sul server;
#   - scripts/setup-environment.sh crea l'Environment con vars e secret.
# GH_TOKEN va creato a parte, di solito come secret dell'organizzazione.
#
# Su un progetto migrato il primo deploy va fatto sullo stesso commit già in
# produzione: da Actions, "Run workflow" su un branch o un tag che punta a quel
# commit.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qat:
    if: github.ref_name != 'main'
    uses: ITinternalDiMartino/ci-workflows/.github/workflows/laravel-projects-deploy.yml@main
    with:
      environment: qat
      # la versione del PHP del dominio: setup-environment.sh la stampa
      php-version: "8.4"
      node-version: "22"
      releases-keep: 1
      smoke-from: "server"
      smoke-timeout: 60
      auto-rollback: false
      # va lasciato a false se il progetto ha rotte dichiarate con closure
      cache-routes: false
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}

  production:
    if: github.ref_name == 'main'
    uses: ITinternalDiMartino/ci-workflows/.github/workflows/laravel-projects-deploy.yml@main
    with:
      environment: production
      php-version: "8.4"
      node-version: "22"
      releases-keep: 2
      smoke-from: server
      smoke-timeout: 60
      auto-rollback: false
      decisions-script: scripts/deploy-decisions.sh
      rotation-exclude: 000-legacy
      # va lasciato a false se il progetto ha rotte dichiarate con closure
      cache-routes: false
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
