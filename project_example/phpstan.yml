name: PHPStan check

on:
  pull_request:
    branches-ignore: ["main", "dev"]
    paths:
      - "**.php"
      - "phpstan.neon*"
      - "phpstan-baseline.neon"
      - "composer.lock"
      - ".github/workflows/phpstan.yml"

jobs:
  call-workflow:
    uses: ITinternalDiMartino/ci-workflows/.github/workflows/phpstan.yml@main
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
