name: PHPStan check

on:
  pull_request:
    branches-ignore: ["main", "dev"]
    paths:
      - "**/*.php"
      - "phpstan.neon*"
      - "phpstan-baseline.neon"
      - "composer.lock"
      - ".github/workflows/phpstan.yml"

permissions:
  contents: read

jobs:
  phpstan:
    uses: ITinternalDiMartino/ci-workflows/.github/workflows/phpstan.yml@main
    with:
      # la versione del PHP del dominio: va allineata al server
      php-version: "8.4"
      # dev-standards:install crea phpstan.neon, non phpstan.neon.dist
      phpstan-config: phpstan.neon
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
