name: Pint check

on:
  pull_request:
    branches-ignore: ["main", "dev"]
    paths:
      - "**/*.php"
      - "pint.json"
      - "composer.lock"
      - ".github/workflows/pint-check.yml"

permissions:
  contents: read

jobs:
  pint-check:
    uses: ITinternalDiMartino/ci-workflows/.github/workflows/pint-check.yml@main
    with:
      # la versione del PHP del dominio: va allineata al server
      php-version: "8.4"
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
