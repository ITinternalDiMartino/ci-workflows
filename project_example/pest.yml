name: Run Laravel Tests

on:
  pull_request:
    branches-ignore: ["main", "dev"]
    paths:
      - "**/*.php"
      - ".github/workflows/pest.yml"
      - "phpunit.xml.dist"
      - "composer.json"
      - "composer.lock"

permissions:
  contents: read

jobs:
  pest:
    uses: ITinternalDiMartino/ci-workflows/.github/workflows/pest.yml@main
    with:
      # la versione del PHP del dominio: va allineata al server
      php-versions: '["8.4"]'
      # database: pgsql   # default mysql
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
