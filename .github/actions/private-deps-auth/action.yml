name: Private dependencies authentication
description: >-
  Lets npm fetch dependencies hosted on private repositories of the organisation,
  authenticating git with the given token. Does nothing when the token is empty.

inputs:
  token:
    description: "Token con lettura sui repository privati dell'organizzazione. Se è vuoto l'action non fa niente"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Configure git authentication for private npm dependencies
      if: ${{ inputs.token != '' }}
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
      run: |
        # actions/checkout installs a repository-scoped credential, in recent versions
        # through a config file pulled in via includeIf. It wins over anything we add and
        # cannot read other private repositories, so npm fails on a private dependency.
        # Drop it and authenticate with the token, which spans the organisation and still
        # allows pushing. npm also normalises GitHub URLs to ssh, hence the second rule.
        for key in $(git config --local --name-only --get-regexp '^includeif\.' || true); do
          git config --local --unset-all "$key" || true
        done
        git config --local --unset-all http."https://github.com/".extraheader || true
        git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
        git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
