name: Pint Check

on:
  workflow_call:
    inputs:
      php-version:
        description: "Versione PHP da usare"
        required: false
        default: "8.3"
        type: string
    secrets:
      GH_TOKEN:
        required: false

jobs:
  pint-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none

      - name: Configure authentication for private dependencies
        uses: ITinternalDiMartino/ci-workflows/.github/actions/private-deps-auth@main
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run Pint check
        run: ./vendor/bin/pint --test
