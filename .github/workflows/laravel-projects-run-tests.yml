name: Full CI

on:
  workflow_call:
    inputs:
      php-versions:
        description: "Lista delle versioni PHP in formato JSON"
        required: false
        default: '["8.3"]'
        type: string
      node-version:
        description: "Versione di Node.js"
        required: false
        default: "22"
        type: string
      database:
        description: "Database dei test: mysql o pgsql"
        required: false
        default: "mysql"
        type: string
      postgres-version:
        description: "Versione dell'immagine postgres, usata solo con database pgsql"
        required: false
        default: "17"
        type: string
    secrets:
      GH_TOKEN:
        required: true

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        php: ${{ fromJson(inputs.php-versions) }}
      fail-fast: true
    name: PHP ${{ matrix.php }}
    # Un service con image vuota non viene avviato: così parte solo il database
    # scelto con l'input database.
    services:
      mysql:
        image: ${{ inputs.database == 'mysql' && 'mysql:8.0' || '' }}
        env:
          MYSQL_DATABASE: tests
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_ROOT_PASSWORD: ""
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=30s
      postgres:
        image: ${{ inputs.database == 'pgsql' && format('postgres:{0}', inputs.postgres-version) || '' }}
        env:
          POSTGRES_DB: tests
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          --health-start-period=30s

    # A livello di job e non sul solo step dei test: anche migrate deve vederle,
    # altrimenti legge il DB_HOST di .env.example, che sul runner non esiste.
    env:
      DB_CONNECTION: ${{ inputs.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ inputs.database == 'pgsql' && '5432' || '3306' }}
      DB_DATABASE: tests
      DB_USERNAME: root
      DB_PASSWORD: ${{ inputs.database == 'pgsql' && 'password' || '' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Configure git authentication for private npm dependencies
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        if: ${{ env.GH_TOKEN != '' }}
        run: |
          # actions/checkout installs a repository-scoped credential, in recent versions
          # through a config file pulled in via includeIf. It wins over anything we add and
          # cannot read other private repositories, so npm fails on a private dependency.
          # Drop it and authenticate with GH_TOKEN, which spans the organisation and still
          # allows pushing. npm also normalises GitHub URLs to ssh, hence the second rule.
          for key in $(git config --local --name-only --get-regexp '^includeif\.' || true); do
            git config --local --unset-all "$key" || true
          done
          git config --local --unset-all http."https://github.com/".extraheader || true
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"

      - name: Install Node Dependencies
        run: npm ci

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          tools: composer
          extensions: json, dom, curl, libxml, mbstring, pdo_mysql, pdo_pgsql
          ini-values: memory_limit=512M, max_execution_time=180, display_errors=On

      - name: Configure Composer Authentication
        run: composer config --global --auth github-oauth.github.com ${{ secrets.GH_TOKEN }}

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Build Assets
        run: npm run build

      - name: Environment configuration
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear

      - name: Run Migrations
        run: php artisan migrate --force

      - name: Run Tests
        run: php artisan test --parallel --testsuite=Unit,Feature

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-php-${{ matrix.php }}
          path: |
            storage/logs/*
            coverage/*
          retention-days: 7
          if-no-files-found: warn
