name: Check workflows

# Protegge i repository che chiamano i workflow di ci-workflows: actionlint trova
# gli errori di sintassi ed espressione, check-workflow-references.sh trova i
# riferimenti a workflow rinominati o cancellati, la suite dello smoke test della
# Release blocca una regressione nei verdetti prima che arrivi a un deploy, la
# suite di setup-releases protegge i file che legacy e cleanup copiano e cancellano.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Solo warning ed errori di shellcheck: le note informative (es. SC2029 sulle
      # variabili espanse in locale nei comandi ssh del deploy) sono volute.
      - name: Run actionlint
        run: |
          docker run --rm -e SHELLCHECK_OPTS=--severity=warning \
            -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.7 -no-color

  references:
    name: Workflow references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ORG_READ_TOKEN deve leggere i contenuti di tutti i repository dell'organizzazione:
      # un riferimento rotto in un repository che il token non vede passerebbe inosservato.
      - name: Check references to ci-workflows
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          STRICT: "true"
        run: scripts/check-workflow-references.sh

  release-smoke-test:
    name: Release smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Il module gira sui server con una shell minima: shellcheck lo legge come
      # POSIX sh, e la suite lo lancia con dash.
      - name: Lint the module and its suite
        run: shellcheck -s sh scripts/release-smoke-test.sh scripts/tests/release-smoke-test.test.sh

      - name: Run the suite
        run: scripts/tests/release-smoke-test.test.sh

  setup-releases:
    name: setup-releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Lo script gira sui server cPanel come 'sh -s': shellcheck lo legge come
      # POSIX sh, e la suite lo lancia con dash.
      - name: Lint the script and its suite
        run: shellcheck -s sh scripts/setup-releases.sh scripts/tests/setup-releases.test.sh

      - name: Run the suite
        run: scripts/tests/setup-releases.test.sh
