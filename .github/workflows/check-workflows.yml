name: Check workflows

# Protegge i repository che chiamano i workflow di ci-workflows: actionlint trova
# gli errori di sintassi ed espressione, check-workflow-references.sh trova i
# riferimenti a workflow rinominati o cancellati.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Solo warning ed errori di shellcheck: le note informative (es. SC2029 sulle
      # variabili espanse in locale nei comandi ssh del deploy) sono volute.
      - name: Run actionlint
        run: |
          docker run --rm -e SHELLCHECK_OPTS=--severity=warning \
            -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.7 -no-color

  references:
    name: Workflow references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ORG_READ_TOKEN deve leggere i contenuti di tutti i repository dell'organizzazione.
      # GH_TOKEN, usato per composer e npm, non vede tutti i progetti: col solo GH_TOKEN il
      # controllo è parziale, e questo step lo segnala.
      - name: Warn when the organisation-wide token is missing
        env:
          HAS_ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN != '' }}
        run: |
          if [ "$HAS_ORG_READ_TOKEN" != "true" ]; then
            echo "::warning title=Controllo parziale::Segreto ORG_READ_TOKEN assente: uso GH_TOKEN, che non vede tutti i repository dell'organizzazione."
          fi

      # STRICT diventa "true" quando i repository chiamanti sono stati sistemati
      # (ITinternalDiMartino/ci-workflows#59): da lì un riferimento rotto fa fallire il job.
      - name: Check references to ci-workflows
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN || secrets.GH_TOKEN }}
          STRICT: "false"
        run: scripts/check-workflow-references.sh
