name: Prettier Check

on:
  workflow_call:
    inputs:
      node-version:
        description: "Versione di Node.js"
        required: false
        default: "22"
        type: string
    secrets:
      GH_TOKEN:
        required: false

jobs:
  prettier-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Configure authentication for private dependencies
        uses: ITinternalDiMartino/ci-workflows/.github/actions/private-deps-auth@main
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Install Node dependencies
        run: npm ci

      - name: Run Prettier check
        run: npx prettier --check .
