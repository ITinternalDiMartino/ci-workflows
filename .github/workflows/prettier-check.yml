name: Prettier Check

on:
  workflow_call:
    inputs:
      node-version:
        description: "Versione di Node.js"
        required: false
        default: "22"
        type: string
    secrets:
      GH_TOKEN:
        required: false

jobs:
  prettier-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Configure git authentication for private npm dependencies
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        if: ${{ env.GH_TOKEN != '' }}
        run: |
          # npm normalises GitHub URLs to ssh, which the runner cannot authenticate.
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          # actions/checkout writes a repo-local extraheader carrying a token scoped to
          # this repository only. It takes precedence over any global credential, so npm
          # would authenticate as that token and get "Repository not found" for the
          # private dependency. Replace it with GH_TOKEN, which spans the organisation.
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git config --local --replace-all http."https://github.com/".extraheader "AUTHORIZATION: basic ${AUTH}"
          git config --global http."https://github.com/".extraheader "AUTHORIZATION: basic ${AUTH}"

      - name: Install Node dependencies
        run: npm ci

      - name: Run Prettier check
        run: npx prettier --check .
