on:
  workflow_call:

jobs:
  docs-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate PR checklist + docs rules
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.pull_request.body || "";

            const checkedNoChanges = body.includes("- [x] No functional change");
            const checkedDocs = body.includes("- [x] Documentation updated");

            if (!checkedNoChanges && !checkedDocs) {
              core.setFailed("Tick one option in the 'Documentation impact' block of the PR template.");
              return;
            }

            if (checkedDocs) {
              const { data: files } = await github.rest.pulls.listFiles({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
              });

              const docsChanged = files.some(f =>
                f.filename.startsWith("docs/")
              );

              if (!docsChanged) {
                core.setFailed(
                  "'Documentation updated' is ticked but this PR changes no file under docs/."
                );
              }
            }
