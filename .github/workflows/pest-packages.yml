name: Pest Packages

on:
  workflow_call:
    inputs:
      os:
        description: "Lista dei sistemi operativi in formato JSON"
        required: false
        default: '["ubuntu-latest"]'
        type: string
      php-versions:
        description: "Lista delle versioni PHP in formato JSON"
        required: false
        default: '["8.3"]'
        type: string
      laravel-versions:
        description: "Lista delle versioni Laravel in formato JSON"
        required: false
        default: '["13.*", "12.*"]'
        type: string
      stability:
        description: "Lista stabilità Composer in formato JSON"
        required: false
        default: '["prefer-stable"]'
        type: string
    secrets:
      GH_TOKEN:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        # The steps are bash scripts, while windows runners default to PowerShell.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.os) }}
        php: ${{ fromJson(inputs.php-versions) }}
        laravel: ${{ fromJson(inputs.laravel-versions) }}
        stability: ${{ fromJson(inputs.stability) }}

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Configure Composer Authentication
        run: composer config --global --auth github-oauth.github.com ${{ secrets.GH_TOKEN }}

      - name: Install dependencies
        env:
          LARAVEL: ${{ matrix.laravel }}
          STABILITY: ${{ matrix.stability }}
        run: |
          # The testbench version follows from the Laravel one. Mapping it here, rather than
          # with matrix include entries, avoids the stray job GitHub adds for an include
          # entry that matches no requested Laravel version.
          case "$LARAVEL" in
            13.*) testbench="11.*" ;;
            12.*) testbench="10.*" ;;
            *)
              echo "::error::Laravel $LARAVEL is not supported: use 13.* or 12.*"
              exit 1
              ;;
          esac
          composer require "laravel/framework:$LARAVEL" "orchestra/testbench:$testbench" --no-interaction --no-update
          composer update "--$STABILITY" --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci
